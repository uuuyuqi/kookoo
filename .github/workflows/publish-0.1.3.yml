name: Publish signed Kookoo 0.1.3
on:
  push:
    paths: ['.github/workflows/publish-0.1.3.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.repository == 'uuuyuqi/kookoo'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      GH_REPO: uuuyuqi/kookoo
      SOURCE_SHA: 15e2606fa3d940168d4aa86bb130ea7261061bf1
      VERIFIED_RUN: '43580079822'
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact tested and signed artifacts
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/$VERIFIED_RUN --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api repos/$GH_REPO/actions/runs/$VERIFIED_RUN --jq '.conclusion')" = success
          mkdir -p dist
          gh run download "$VERIFIED_RUN" --repo "$GH_REPO" --name Kookoo-macOS --dir dist
          shasum -a 256 -c dist/SHA256SUMS
          signature=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("dist/appcast.xml").find(".//enclosure").attrib["{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature"])')
          swift scripts/verify-update-signature.swift dist/Kookoo-v0.1.3.dmg "$(cat config/sparkle-public-key.txt)" "$signature"
      - name: Publish preview archive without replacing previous releases
        run: |
          cat > notes.md <<'NOTES'
          Kookoo 0.1.3 Preview enables the signed Sparkle update channel.
          
          Install this version manually once. Versions 0.1.0–0.1.2 did not contain the configured production trust anchor and cannot bootstrap it in place. After this installation, Check for Updates uses Sparkle and asks before installation/restart; restart stops terminal commands and agents. Automatic checks/downloads remain off.
          
          Includes the approved single-panel orange/cyan icon with transparent legacy silhouette and stronger divider, plus preview-aware update selection.
          
          Validation: 1,100 tests, 0 failures, 6 environment/opt-in skips; App/DMG and mounted icon checks; actual production archive signature verified; tampering/wrong-key rejection; real Sparkle CLI upgraded an isolated full-App fixture, rejected bad signatures/read-only installation, and preserved the old fixture on interrupted download. The publication job also verifies uploaded assets and the real HTTPS production feed. See Actions for its final result.
          
          Limits: CLI installation tests are not a claim of completed GUI Later/Restart or active-terminal UX testing. Apple silicon/macOS 14+. Ad-hoc signed, not Apple-notarized; Gatekeeper and company policies can still block execution. No controls are bypassed.
          
          The update signing private key is held only in the repository's encrypted Actions secret, with no independent backup. Losing it can require manual reinstall to establish a new trust anchor; see docs/updating.md. No private key is included in source, release assets or logs.
          NOTES
          gh release create v0.1.3 --repo "$GH_REPO" --target "$SOURCE_SHA" --title "Kookoo 0.1.3 Preview" --prerelease --notes-file notes.md dist/Kookoo-v0.1.3.dmg dist/SHA256SUMS dist/appcast.xml
      - name: Verify uploaded asset and activate public update feed
        run: |
          mkdir downloaded
          gh release download v0.1.3 --repo "$GH_REPO" --dir downloaded
          cmp dist/Kookoo-v0.1.3.dmg downloaded/Kookoo-v0.1.3.dmg
          cmp dist/appcast.xml downloaded/appcast.xml
          python3 - <<'PY' > feed-request.json
          import base64,json,pathlib,subprocess
          data={"message":"Publish verified 0.1.3 signed update feed","content":base64.b64encode(pathlib.Path("dist/appcast.xml").read_bytes()).decode(),"branch":"main"}
          p=subprocess.run(["gh","api","repos/uuuyuqi/kookoo/contents/appcast.xml"],capture_output=True,text=True)
          if p.returncode==0:data["sha"]=json.loads(p.stdout)["sha"]
          print(json.dumps(data))
          PY
          gh api --method PUT repos/$GH_REPO/contents/appcast.xml --input feed-request.json --silent
          for i in {1..24}; do
            if curl -fsSL https://raw.githubusercontent.com/uuuyuqi/kookoo/main/appcast.xml -o public-appcast.xml && cmp -s dist/appcast.xml public-appcast.xml; then break; fi
            sleep 5
          done
          cmp dist/appcast.xml public-appcast.xml
      - name: Verify real published feed can install its signed archive
        run: bash scripts/tests/sparkle-production-feed-smoke.sh downloaded/Kookoo-v0.1.3.dmg 0.1.3
