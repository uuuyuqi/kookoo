name: Publish signed Kookoo 0.1.6
on:
  push:
    paths: ['.github/workflows/publish-0.1.6.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.repository == 'uuuyuqi/kookoo'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      GH_REPO: uuuyuqi/kookoo
      SOURCE_SHA: a8f8234402e503b233cd6e4ac3765ceadfda1853
      VERIFIED_RUN: '43592309494'
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact tested and signed artifacts
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/$VERIFIED_RUN --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api repos/$GH_REPO/actions/runs/$VERIFIED_RUN --jq '.conclusion')" = success
          mkdir -p dist
          gh run download "$VERIFIED_RUN" --repo "$GH_REPO" --name Kookoo-macOS --dir dist
          shasum -a 256 -c dist/SHA256SUMS
          signature=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("dist/appcast.xml").find(".//enclosure").attrib["{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature"])')
          swift scripts/verify-update-signature.swift dist/Kookoo-v0.1.6.dmg "$(cat config/sparkle-public-key.txt)" "$signature"
      - name: Publish preview archive without replacing previous releases
        run: |
          cat > notes.md <<'NOTES'
          Kookoo 0.1.6 Preview changes the OMP agent icon to the approved white-backed variant. The original OMP glyph and gradient remain unchanged. This is a Kookoo adaptation, not an official OMP variant or endorsement.

          The icon is shared by the sidebar, menus and agent identity surfaces. The white rounded backing is kept in both light and dark themes. This release also includes the localized README corrections and deterministic git-status test synchronization already on main. No terminal engine change is included.

          Validation includes the macOS test suite with OMP white-background, gradient, transparent-corner and full-color rendering assertions; app/DMG packaging, icons and bundled NOTICE checks; update signature checks; and isolated Sparkle installer E2E. The light/dark icon design was user-reviewed in a static preview, not a native macOS screenshot. Native GUI visual acceptance remains distinct from automated verification.

          Update/restart closes active terminal sessions; save work first. No automatic user-app restart is performed. Apple silicon/macOS 14+. Ad-hoc signed, not Apple-notarized; Gatekeeper and enterprise policy can still block execution. No security controls are bypassed.
          NOTES
          gh release create v0.1.6 --repo "$GH_REPO" --target "$SOURCE_SHA" --title "Kookoo 0.1.6 Preview" --prerelease --notes-file notes.md dist/Kookoo-v0.1.6.dmg dist/SHA256SUMS dist/appcast.xml
      - name: Verify uploaded asset and activate public update feed
        run: |
          mkdir downloaded
          gh release download v0.1.6 --repo "$GH_REPO" --dir downloaded
          cmp dist/Kookoo-v0.1.6.dmg downloaded/Kookoo-v0.1.6.dmg
          cmp dist/appcast.xml downloaded/appcast.xml
          python3 - <<'PY' > feed-request.json
          import base64,json,pathlib,subprocess
          data={"message":"Publish verified 0.1.6 signed update feed","content":base64.b64encode(pathlib.Path("dist/appcast.xml").read_bytes()).decode(),"branch":"main"}
          p=subprocess.run(["gh","api","repos/uuuyuqi/kookoo/contents/appcast.xml"],capture_output=True,text=True)
          if p.returncode==0:data["sha"]=json.loads(p.stdout)["sha"]
          print(json.dumps(data))
          PY
          gh api --method PUT repos/$GH_REPO/contents/appcast.xml --input feed-request.json --silent
          for i in {1..24}; do
            if curl -fsSL https://raw.githubusercontent.com/uuuyuqi/kookoo/main/appcast.xml -o public-appcast.xml && cmp -s dist/appcast.xml public-appcast.xml; then break; fi
            sleep 5
          done
          cmp dist/appcast.xml public-appcast.xml
      - name: Verify real published feed can install its signed archive
        run: |
          mkdir previous
          gh release download v0.1.5 --repo "$GH_REPO" --pattern Kookoo-v0.1.5.dmg --dir previous
          bash scripts/tests/sparkle-production-feed-smoke.sh downloaded/Kookoo-v0.1.6.dmg 0.1.6 previous/Kookoo-v0.1.5.dmg
