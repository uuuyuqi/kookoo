name: Publish signed Kookoo 0.1.15
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-0.1.15.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.repository == 'uuuyuqi/kookoo' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      GH_REPO: uuuyuqi/kookoo
      SOURCE_SHA: b88377d035d8f953d9e0d7ef52f04b04dbff5ffe
      VERIFIED_RUN: '44868502983'
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact tested and signed artifacts
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/$VERIFIED_RUN --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api repos/$GH_REPO/actions/runs/$VERIFIED_RUN --jq '.conclusion')" = success
          test "$(gh api repos/$GH_REPO/actions/runs/$VERIFIED_RUN --jq '.head_branch')" = main
          test "$(gh api repos/$GH_REPO/actions/runs/$VERIFIED_RUN --jq '.event')" = push
          test "$(gh api repos/$GH_REPO/actions/runs/$VERIFIED_RUN --jq '.path')" = .github/workflows/kookoo-checks.yml
          test "$(gh api repos/$GH_REPO/branches/main --jq '.commit.parents[0].sha')" = "$SOURCE_SHA"
          mkdir -p dist
          gh run download "$VERIFIED_RUN" --repo "$GH_REPO" --name Kookoo-macOS --dir dist
          shasum -a 256 -c dist/SHA256SUMS
          signature=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("dist/appcast.xml").find(".//enclosure").attrib["{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature"])')
          swift scripts/verify-update-signature.swift dist/Kookoo-v0.1.15.dmg "$(cat config/sparkle-public-key.txt)" "$signature"
      - name: Publish preview archive without replacing previous releases
        run: |
          cat > notes.md <<'NOTES'
          Kookoo 0.1.15 Preview refines the terminal tabs and new-tab launcher.

          - The new-tab launcher highlight shares the selected workspace card’s styling (white in light mode). The first row has more space beneath the popup’s rounded corners.
          - The first selected terminal tab aligns with the pane’s left edge. A rounded transition joins the selected tab to the divider.
          - No new app icons in this release.

          Validation: macOS build and automated tests, existing native UI regression checks, strict bundle and DMG verification, isolated Sparkle installation, and production archive signature verification. The new appearance was not individually exercised by the automated UI smoke test. Testing is on disposable macOS CI, not a company-managed device.

          The raw.githubusercontent.com update feed and production engine are unchanged. If that host is unreachable, automatic update checks may still time out; manually download this DMG. No GitHub Pages service was enabled.

          Save terminal work before update/restart. Apple silicon/macOS 14+. Ad-hoc signed, not Apple-notarized; Gatekeeper and enterprise policy can still block execution.
          NOTES
          gh release create v0.1.15 --repo "$GH_REPO" --target "$SOURCE_SHA" --title "Kookoo 0.1.15 Preview" --prerelease --notes-file notes.md dist/Kookoo-v0.1.15.dmg dist/SHA256SUMS dist/appcast.xml
      - name: Verify uploaded asset and activate public update feed
        run: |
          mkdir downloaded
          gh release download v0.1.15 --repo "$GH_REPO" --dir downloaded
          cmp dist/Kookoo-v0.1.15.dmg downloaded/Kookoo-v0.1.15.dmg
          cmp dist/appcast.xml downloaded/appcast.xml
          test "$(gh api repos/$GH_REPO/branches/main --jq '.commit.parents[0].sha')" = "$SOURCE_SHA"
          python3 - <<'PY' > feed-request.json
          import base64,json,pathlib,subprocess
          data={"message":"Publish verified 0.1.15 signed update feed","content":base64.b64encode(pathlib.Path("dist/appcast.xml").read_bytes()).decode(),"branch":"main"}
          p=subprocess.run(["gh","api","repos/uuuyuqi/kookoo/contents/appcast.xml"],capture_output=True,text=True)
          if p.returncode==0:data["sha"]=json.loads(p.stdout)["sha"]
          print(json.dumps(data))
          PY
          gh api --method PUT repos/$GH_REPO/contents/appcast.xml --input feed-request.json --silent
          for i in {1..24}; do
            if curl -fsSL https://raw.githubusercontent.com/uuuyuqi/kookoo/main/appcast.xml -o public-appcast.xml && cmp -s dist/appcast.xml public-appcast.xml; then break; fi
            sleep 5
          done
          cmp dist/appcast.xml public-appcast.xml
      - name: Verify real published feed can install its signed archive
        run: |
          mkdir previous
          gh release download v0.1.14 --repo "$GH_REPO" --pattern Kookoo-v0.1.14.dmg --dir previous
          bash scripts/tests/sparkle-production-feed-smoke.sh downloaded/Kookoo-v0.1.15.dmg 0.1.15 previous/Kookoo-v0.1.14.dmg
