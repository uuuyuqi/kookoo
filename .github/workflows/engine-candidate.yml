name: Independent engine candidate (no release)
on:
  workflow_dispatch:
  push:
    branches: [fork/independent-engine]
    paths:
      - scripts/build-libghostty.sh
      - scripts/package-engine-compliance.py
      - scripts/kooky-libghostty-issue53.patch
      - .github/workflows/engine-candidate.yml
permissions:
  contents: read
jobs:
  build-and-integrate:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build exact pinned source and run upstream tests
        run: bash scripts/build-libghostty.sh
      - name: Test Kookoo with candidate (isolated runner only)
        run: |
          cd dist/engine-candidate
          shasum -a 256 -c SHA256SUMS
          cd ../..
          mkdir -p Vendor
          tar -xzf dist/engine-candidate/GhosttyKit.xcframework.tar.gz -C Vendor
          ar -t Vendor/GhosttyKit.xcframework/macos-arm64/libghostty-internal.a > dist/engine-candidate/archive-members.txt
          if grep -Eq "(sentry_|breakpad_|minidump_|crash_generation_client|exception_handler)" dist/engine-candidate/archive-members.txt; then echo "Unexpected crash SDK object; original engine did not include it" >&2; exit 1; fi
          swift test --build-system native
          KOOKOO_ENGINE_COMPLIANCE_DIR=dist/engine-candidate/EngineCompliance bash scripts/build-app.sh
          codesign --verify --deep --strict dist/Kookoo.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: independent-engine-candidate
          path: dist/engine-candidate
          if-no-files-found: warn
