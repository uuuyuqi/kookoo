name: Isolated App Icon Safety Probe
on:
  push:
    branches: [research/icon-switch-safety-20261114]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Probe temporary application only
        shell: bash
        run: |
          set -eu
          ROOT="$(mktemp -d)"
          export ROOT
          mkdir -p "$ROOT/evidence"
          exec > >(tee "$ROOT/evidence/probe.log") 2>&1
          sw_vers
          xcodebuild -version
          cat > "$ROOT/helper.swift" <<'SWIFT'
          import AppKit
          let args = CommandLine.arguments
          let action = args[1], path = args[2]
          if action == "make" {
            let image = NSImage(size: NSSize(width: 512, height: 512))
            image.lockFocus()
            NSColor.systemOrange.setFill()
            NSBezierPath(roundedRect: NSRect(x: 20,y: 20,width: 472,height: 472), xRadius: 90,yRadius: 90).fill()
            ("K" as NSString).draw(at: NSPoint(x: 155,y: 135), withAttributes: [.font:NSFont.boldSystemFont(ofSize: 240), .foregroundColor:NSColor.white])
            image.unlockFocus()
            try NSBitmapImageRep(data: image.tiffRepresentation!)!.representation(using: .png, properties: [:])!.write(to: URL(fileURLWithPath:path))
          } else if action == "set" {
            print("setIcon result:", NSWorkspace.shared.setIcon(NSImage(contentsOfFile: args[3]), forFile:path, options: []))
          } else if action == "clear" {
            print("clearIcon result:", NSWorkspace.shared.setIcon(nil, forFile:path, options: []))
          } else if action == "read" {
            try NSWorkspace.shared.icon(forFile:path).tiffRepresentation!.write(to: URL(fileURLWithPath:args[3]))
          }
          SWIFT
          cat > "$ROOT/main.swift" <<'SWIFT'
          import AppKit
          let app = NSApplication.shared
          if CommandLine.arguments.count > 1 {
            try "launched via LaunchServices".write(toFile:CommandLine.arguments[1], atomically:true, encoding:.utf8)
          }
          SWIFT
          swiftc "$ROOT/helper.swift" -o "$ROOT/helper"
          swiftc "$ROOT/main.swift" -o "$ROOT/probe"
          "$ROOT/helper" make "$ROOT/custom.png"
          APP="$ROOT/Probe.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$ROOT/probe" "$APP/Contents/MacOS/Probe"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>dev.kookoo.isolated-icon-probe</string>
          <key>CFBundleExecutable</key><string>Probe</string>
          <key>CFBundleName</key><string>Icon Safety Probe</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          </dict></plist>
          PLIST
          codesign --force --sign - "$APP"
          ditto "$APP" "$ROOT/Pristine.app"
          snapshot() {
            STAGE="$1"
            echo "========== $STAGE =========="
            set +e
            codesign --verify --deep --strict --verbose=4 "$APP" 2>&1
            echo "CODESIGN_STRICT_EXIT=$?"
            codesign --verify --verbose=4 "$APP" 2>&1
            echo "CODESIGN_NORMAL_EXIT=$?"
            xattr -lr "$APP"
            find "$APP" -type f -print
            "$ROOT/helper" read "$APP" "$ROOT/evidence/$STAGE.tiff"
            shasum -a 256 "$ROOT/evidence/$STAGE.tiff"
            MARKER="$ROOT/evidence/$STAGE.launch"
            open -W -n "$APP" --args "$MARKER"
            echo "LAUNCHSERVICES_EXIT=$?"
            if test -f "$MARKER"; then cat "$MARKER"; else echo "NO_LAUNCH_MARKER"; fi
            echo
            set -e
          }
          snapshot baseline
          "$ROOT/helper" set "$APP" "$ROOT/custom.png"
          snapshot custom
          "$ROOT/helper" clear "$APP"
          snapshot cleared
          "$ROOT/helper" set "$APP" "$ROOT/custom.png"
          # Simulate the core whole-bundle replacement of an updater.
          # This is NOT claimed to be a real Sparkle update.
          mv "$APP" "$ROOT/Old.app"
          ditto "$ROOT/Pristine.app" "$APP"
          snapshot replaced
          "$ROOT/helper" set "$APP" "$ROOT/custom.png"
          snapshot reapplied
          echo "LIMITATIONS: ad-hoc signature only; no Developer ID/notarization; no Sparkle integration; NSWorkspace icon lookup is not visual Finder/Launchpad validation."
          echo "EVIDENCE=$ROOT/evidence"
          echo "PROBE_EVIDENCE=$ROOT/evidence" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icon-safety-${{ matrix.os }}
          path: ${{ env.PROBE_EVIDENCE }}
