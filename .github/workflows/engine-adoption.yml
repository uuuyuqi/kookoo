name: Independent engine adoption on current app (no release)
on:
  workflow_dispatch:
  push:
    branches: [fork/engine-production-candidate]
permissions:
  contents: read
  actions: read
jobs:
  integrate:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: independent-engine-candidate
          run-id: 43598330698
          github-token: ${{ github.token }}
          path: dist/reviewed-engine
      - name: Verify reviewed source and binary before isolated integration
        run: |
          cd dist/reviewed-engine
          echo '6bada6f5bf2e2105a1a5069dd705a1eafd6300a88fc19827e4b1fc53b0a58a10  GhosttyKit.xcframework.tar.gz' | shasum -a 256 -c -
          cd EngineCompliance
          shasum -a 256 -c SHA256SUMS
          cd ../../..
          mkdir -p Vendor
          tar -xzf dist/reviewed-engine/GhosttyKit.xcframework.tar.gz -C Vendor
      - name: Test current application against reviewed engine
        run: swift test --build-system native
      - name: Package notices before app signature
        env:
          KOOKOO_ENGINE_COMPLIANCE_DIR: dist/reviewed-engine/EngineCompliance
        run: |
          bash scripts/build-app.sh
          test -f dist/Kookoo.app/Contents/Resources/EngineThirdPartyNotices.md
          test -f dist/Kookoo.app/Contents/Resources/EngineLicenses/manifest.json
          python3 - <<'PY_VERIFY'
          import pathlib, json, hashlib
          root = pathlib.Path("dist/Kookoo.app/Contents/Resources/EngineLicenses")
          for item in json.loads((root / "manifest.json").read_text()):
              p = root / item["path"]
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest() == item["sha256"], p
          PY_VERIFY
          codesign --verify --deep --strict dist/Kookoo.app
      - name: Exercise current app in disposable GUI session
        run: bash scripts/tests/engine-gui-smoke.sh dist/Kookoo.app
      - name: Exercise About and third-party entry without granting permissions
        id: about
        continue-on-error: true
        run: bash scripts/tests/engine-about-smoke.sh dist/Kookoo.app
      - name: Build exact candidate DMG and exercise Sparkle installer
        run: |
          bash scripts/build-dmg.sh
          mount=$(mktemp -d)
          hdiutil attach dist/Kookoo-*.dmg -mountpoint "$mount" -readonly -nobrowse -quiet
          mkdir -p dist/from-dmg
          ditto "$mount/Kookoo.app" dist/from-dmg/Kookoo.app
          hdiutil detach "$mount" -quiet
          rmdir "$mount"
          codesign --verify --deep --strict dist/from-dmg/Kookoo.app
          cmp dist/Kookoo.app/Contents/Resources/EngineThirdPartyNotices.md dist/from-dmg/Kookoo.app/Contents/Resources/EngineThirdPartyNotices.md
          bash scripts/tests/sparkle-install-e2e.sh dist/from-dmg/Kookoo.app
      - name: Package current application corresponding source and engine materials
        run: python3 scripts/package-app-engine-materials.py dist/reviewed-engine/EngineCompliance dist/app-engine-materials
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engine-current-app-evidence
          path: |
            dist/app-engine-materials
            dist/engine-gui-evidence
            dist/engine-about-evidence
            dist/updater-e2e-logs
          if-no-files-found: warn
  recipient-relink-current-app:
    needs: integrate
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: engine-current-app-evidence
          path: dist/current-evidence
      - name: Relink actual current app with modified libintl
        run: bash scripts/tests/libintl-relink-probe.sh dist/current-evidence/app-engine-materials dist/current-relink-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engine-current-app-relink-evidence
          path: dist/current-relink-evidence
          if-no-files-found: warn
