name: Kookoo checks
on:
  push:
    branches: [main, 'fork/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Prepare pinned engine
        run: bash scripts/setup-libghostty.sh
      - name: Run tests
        run: swift test --build-system native
      - name: Build app and DMG
        run: |
          bash scripts/build-app.sh
          bash scripts/build-dmg.sh
          bash scripts/verify-package-icons.sh dist/Kookoo-*.dmg
          codesign --verify --deep --strict dist/Kookoo.app
          shasum -a 256 dist/Kookoo-*.dmg > dist/SHA256SUMS
      - name: Sign trusted main update archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'uuuyuqi/kookoo'
        env:
          KOOKOO_SPARKLE_PRIVATE_KEY: ${{ secrets.KOOKOO_SPARKLE_PRIVATE_KEY }}
        run: bash scripts/prepare-signed-update.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Kookoo-macOS
          path: |
            dist/Kookoo-*.dmg
            dist/SHA256SUMS
            dist/appcast.xml
          if-no-files-found: error
