name: Kookoo checks
on:
  push:
    branches: [main, 'fork/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Prepare pinned engine
        run: bash scripts/setup-libghostty.sh
      - name: Repeat git fan-in regression 20 times
        run: |
          for run in $(seq 1 20); do
            echo "Regression run $run/20"
            swift test --build-system native --filter WorkspaceStoreTests.testSameRepoTabSpawnMergesGitStatusFetches
          done
      - name: Run complete test suite
        run: swift test --build-system native
