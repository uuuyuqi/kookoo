name: Kookoo checks
on:
  push:
    branches: [main, 'fork/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Prepare pinned engine
        run: bash scripts/setup-libghostty.sh
      - name: Run tests
        run: swift test --build-system native
      - name: Inspect previous distribution icon declarations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0 --repo uuuyuqi/kookoo --pattern '*.dmg' --dir old-package
          mount=$(mktemp -d)
          hdiutil attach old-package/*.dmg -mountpoint "$mount" -readonly -nobrowse -quiet
          plutil -extract CFBundleIconFile raw "$mount/Kookoo.app/Contents/Info.plist"
          plutil -extract CFBundleIconName raw "$mount/Kookoo.app/Contents/Info.plist" || true
          ls -l "$mount/Kookoo.app/Contents/Resources/AppIcon.icns"
          if test -f "$mount/.VolumeIcon.icns"; then echo 'Old volume icon exists'; else echo 'CONFIRMED: old mounted volume has no .VolumeIcon.icns'; fi
          hdiutil detach "$mount" -quiet
          rmdir "$mount"
          spctl --assess --type open --context context:primary-signature --verbose old-package/*.dmg || true
      - name: Build app and DMG
        run: |
          bash scripts/build-app.sh
          bash scripts/build-dmg.sh
          bash scripts/verify-package-icons.sh dist/Kookoo-*.dmg
          codesign --verify --deep --strict dist/Kookoo.app
          shasum -a 256 dist/Kookoo-*.dmg > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Kookoo-macOS
          path: |
            dist/Kookoo-*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
