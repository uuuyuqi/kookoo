name: Publish validated Kookoo 0.1.1
on:
  push:
    paths: ['.github/workflows/publish-icon-fix.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.repository == 'uuuyuqi/kookoo'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: uuuyuqi/kookoo
      SOURCE_SHA: 166af07beaabd526087be61975de6d8f0286484b
      VERIFIED_RUN: '43574350197'
    steps:
      - name: Verify source run and fetch its exact artifact
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/$VERIFIED_RUN --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api repos/$GH_REPO/actions/runs/$VERIFIED_RUN --jq '.conclusion')" = success
          mkdir dist
          gh run download "$VERIFIED_RUN" --repo "$GH_REPO" --name Kookoo-macOS --dir dist
          sha256sum -c dist/SHA256SUMS
      - name: Publish preview without replacing existing releases
        run: |
          cat > notes.md <<'NOTES'
          Icon packaging fix for Kookoo 0.1.1 Preview.

          The approved light terminal artwork now fills approximately 84% of the canvas instead of 46%, improving Dock/Launchpad legibility without changing the design. The app explicitly references its multi-resolution AppIcon.icns, and the mounted disk volume now has a matching custom icon.

          Verified on macOS CI: 1,090 tests, 0 failures, 6 environment/opt-in skips; release App/DMG build; actual read-only DMG mount; ICNS decode; app icon declaration; volume icon bytes and custom-icon flag; strict bundle signature. The downloaded 0.1.0 package was also inspected: its app icon existed, but its mounted volume had no custom icon. Assets come from the exact verified run, with checksums validated again before publication.

          Important: the downloaded .dmg FILE itself can retain macOS's generic disk-image icon. That differs from the mounted volume and the app icon. Actual Dock/Launchpad cache refresh and interactive rendering on a user's Mac have not been remotely verified.

          Apple silicon / macOS 14+. This preview remains ad-hoc signed, NOT Developer ID signed or notarized. Gatekeeper may still block the DMG or app, as confirmed by assessment; this release does not remove that warning or bypass enterprise security controls. No installation or security-setting changes were performed on the user's Mac.

          Original Kooky history, MIT attribution and third-party notices are retained. See 0.1.0 notes for initial features and provider-integration limitations.
          NOTES
          gh release create v0.1.1 --repo "$GH_REPO" --target "$SOURCE_SHA" --title "Kookoo 0.1.1 Preview" --prerelease --notes-file notes.md dist/Kookoo-v0.1.1.dmg dist/SHA256SUMS
