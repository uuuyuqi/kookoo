name: Isolated Icon Settings GUI
on:
  push:
    branches: [research/icon-switch-safety-20261114]
    paths: [.github/workflows/icon-settings-gui-probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - shell: bash
        run: |
          set -eu
          ROOT="$(mktemp -d)"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ROOT/evidence" "$ROOT/mount" "$ROOT/download"
          exec > >(tee "$ROOT/evidence/gui.log") 2>&1
          gh run download 43602214461 --repo uuuyuqi/kookoo -n Kookoo-macOS -D "$ROOT/download"
          find "$ROOT/download" -maxdepth 3 -type f
          DMG="$(find "$ROOT/download" -name '*.dmg' | head -1)"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$ROOT/mount" -quiet
          ditto "$ROOT/mount/Kookoo.app" "$ROOT/Kookoo.app"
          hdiutil detach "$ROOT/mount" -quiet
          APP="$ROOT/Kookoo.app"
          codesign --verify --deep --strict "$APP"
          open -n "$APP" --args -SUEnableAutomaticChecks NO
          sleep 5
          screencapture -x "$ROOT/evidence/launched.png"
          # Use only existing permissions; never change TCC, SIP, or Gatekeeper.
          set +e
          osascript -e 'tell application "System Events" to tell process "Kookoo" to keystroke "," using command down' >"$ROOT/evidence/open-settings.log" 2>&1
          RC=$?
          set -e
          cat "$ROOT/evidence/open-settings.log"
          echo "OPEN_SETTINGS_EXIT=$RC"
          sleep 5
          screencapture -x "$ROOT/evidence/settings.png"
          if [ "$RC" != 0 ]; then
            echo "GUI_BLOCKED_BY_EXISTING_RUNNER_PERMISSIONS; no permissions granted or bypassed."
            exit 0
          fi
          osascript -e 'tell application "System Events" to tell process "Kookoo" to get entire contents of front window' >"$ROOT/evidence/settings-ax.txt" 2>&1 || true
          cat "$ROOT/evidence/settings-ax.txt"
          osascript <<'AS'
          tell application "System Events" to tell process "Kookoo"
            set frontmost to true
            set p to position of static text "Appearance" of group 1 of window "Settings"
            set z to size of static text "Appearance" of group 1 of window "Settings"
            click at {(item 1 of p) + (item 1 of z) / 2, (item 2 of p) + (item 2 of z) / 2}
          end tell
          AS
          sleep 2
          osascript -e 'tell application "System Events" to tell process "Kookoo" to get entire contents of front window' >"$ROOT/evidence/icons-ax.txt" 2>&1
          cat "$ROOT/evidence/icons-ax.txt"
          screencapture -x "$ROOT/evidence/icon-grid.png"
          cat > "$ROOT/click.applescript" <<'AS'
          on run argv
            tell application "System Events"
              tell process "Kookoo"
                set elems to entire contents of front window
                repeat with e in elems
                  try
                    if role of e is "AXButton" then
                      if name of e is item 1 of argv or description of e is item 1 of argv then
                        click e
                        return "clicked " & item 1 of argv
                      end if
                    end if
                  end try
                end repeat
              end tell
            end tell
            error "button not found: " & item 1 of argv
          end run
          AS
          BID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")"
          ICON="$APP/Contents/Resources/AppIcon.icns"
          cp "$ICON" "$ROOT/baseline.icns"
          PID="$(pgrep -f '/Kookoo.app/Contents/MacOS/Kookoo' | head -1)"
          pgrep -P "$PID" >"$ROOT/children-before.txt" || true
          defaults read "$BID" kookoo.appIconID >"$ROOT/pref-before.txt" 2>&1 || true
          osascript "$ROOT/click.applescript" 'Pearl app icon'
          sleep 1
          screencapture -x "$ROOT/evidence/confirmation.png"
          osascript -e 'tell application "System Events" to tell process "Kookoo" to get entire contents of front window' >"$ROOT/evidence/alert-ax.txt"
          cat "$ROOT/evidence/alert-ax.txt"
          osascript "$ROOT/click.applescript" 'Cancel'
          sleep 1
          cmp "$ROOT/baseline.icns" "$ICON"
          defaults read "$BID" kookoo.appIconID >"$ROOT/pref-cancel.txt" 2>&1 || true
          # Missing-key error text includes timestamps; compare only actual defaults if present.
          echo "CANCEL_ICON_UNCHANGED=YES"
          cat "$ROOT/pref-before.txt" "$ROOT/pref-cancel.txt"
          osascript "$ROOT/click.applescript" 'Pearl app icon'
          sleep 1
          osascript "$ROOT/click.applescript" 'Change Icon'
          sleep 2
          cmp "$ICON" "$APP/Contents/Resources/IconChoices/01-pearl.icns"
          test "$(defaults read "$BID" kookoo.appIconID)" = "01-pearl"
          echo "CONFIRM_ICON_AND_PREFERENCE=YES"
          kill -0 "$PID"
          while read -r CHILD; do kill -0 "$CHILD"; done < "$ROOT/children-before.txt"
          echo "APP_AND_CHILD_SESSIONS_SURVIVED=YES"
          screencapture -x "$ROOT/evidence/selected.png"
          osascript "$ROOT/click.applescript" 'Kookoo app icon'
          sleep 1
          cmp "$ROOT/baseline.icns" "$ICON"
          test "$(defaults read "$BID" kookoo.appIconID)" = "default"
          codesign --verify --deep --strict "$APP"
          echo "DEFAULT_RESTORE_AND_STRICT=YES"
          screencapture -x "$ROOT/evidence/restored.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icon-settings-gui
          path: ${{ env.ROOT }}/evidence
