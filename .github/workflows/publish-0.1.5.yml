name: Publish signed Kookoo 0.1.5
on:
  push:
    paths: ['.github/workflows/publish-0.1.5.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.repository == 'uuuyuqi/kookoo'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      GH_REPO: uuuyuqi/kookoo
      SOURCE_SHA: 1290a99aa8c52ed00696d9a26e5e347e44e41826
      VERIFIED_RUN: '43587107316'
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact tested and signed artifacts
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/$VERIFIED_RUN --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api repos/$GH_REPO/actions/runs/$VERIFIED_RUN --jq '.conclusion')" = success
          mkdir -p dist
          gh run download "$VERIFIED_RUN" --repo "$GH_REPO" --name Kookoo-macOS --dir dist
          shasum -a 256 -c dist/SHA256SUMS
          signature=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("dist/appcast.xml").find(".//enclosure").attrib["{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature"])')
          swift scripts/verify-update-signature.swift dist/Kookoo-v0.1.5.dmg "$(cat config/sparkle-public-key.txt)" "$signature"
      - name: Publish preview archive without replacing previous releases
        run: |
          cat > notes.md <<'NOTES'
          Kookoo 0.1.5 Preview gives the left sidebar the same rounded-card language as terminal panes and adds Devin CLI identity/icon support.

          The sidebar preserves the existing glass/chrome fill, full/compact outer widths, terminal offset and resize hit area. Window traffic-light controls stay outside the card. Native visual acceptance of light/dark contrast and collapsed/expanded transitions is still pending.

          Workspace rows are more compact while keeping both name and path, unchanged fonts and a 44pt minimum click target. Selection is now a lifted light surface with a thin outline and restrained shadow, rather than a heavy grey block; dark themes and increased-contrast accessibility are supported. The pane tab bar and window drag region are unchanged.

          Devin can be launched from the agent menu. New shell launches of devin are recognized through the existing lifecycle wrapper and return to terminal identity on exit. Already-running processes are not retroactively reclassified. Prompt/resume integration is intentionally not claimed. The wrapper does not install Devin, change its configuration, or request credentials.

          Validation includes macOS unit tests, execution of the generated bash wrapper against a fake Devin executable (argument preservation, exit status and missing executable), app/DMG/icon checks, bundled license/NOTICE equality, production update signature checks, and isolated Sparkle installer E2E. Publication also verifies the production HTTPS feed and upgrade from the previously shipped 0.1.4 app.

          GUI Later/Restart and active-terminal interaction are not covered by these tests. Updating/restarting closes running terminal sessions; save your work first. No automatic app restart is performed.

          Apple silicon/macOS 14+. Ad-hoc signed, not Apple-notarized. Gatekeeper and enterprise policy can still block execution; no security controls are bypassed. Devin icon is distributed with LobeHub MIT attribution in the bundled NOTICE.md.
          NOTES
          gh release create v0.1.5 --repo "$GH_REPO" --target "$SOURCE_SHA" --title "Kookoo 0.1.5 Preview" --prerelease --notes-file notes.md dist/Kookoo-v0.1.5.dmg dist/SHA256SUMS dist/appcast.xml
      - name: Verify uploaded asset and activate public update feed
        run: |
          mkdir downloaded
          gh release download v0.1.5 --repo "$GH_REPO" --dir downloaded
          cmp dist/Kookoo-v0.1.5.dmg downloaded/Kookoo-v0.1.5.dmg
          cmp dist/appcast.xml downloaded/appcast.xml
          python3 - <<'PY' > feed-request.json
          import base64,json,pathlib,subprocess
          data={"message":"Publish verified 0.1.5 signed update feed","content":base64.b64encode(pathlib.Path("dist/appcast.xml").read_bytes()).decode(),"branch":"main"}
          p=subprocess.run(["gh","api","repos/uuuyuqi/kookoo/contents/appcast.xml"],capture_output=True,text=True)
          if p.returncode==0:data["sha"]=json.loads(p.stdout)["sha"]
          print(json.dumps(data))
          PY
          gh api --method PUT repos/$GH_REPO/contents/appcast.xml --input feed-request.json --silent
          for i in {1..24}; do
            if curl -fsSL https://raw.githubusercontent.com/uuuyuqi/kookoo/main/appcast.xml -o public-appcast.xml && cmp -s dist/appcast.xml public-appcast.xml; then break; fi
            sleep 5
          done
          cmp dist/appcast.xml public-appcast.xml
      - name: Verify real published feed can install its signed archive
        run: |
          mkdir previous
          gh release download v0.1.4 --repo "$GH_REPO" --pattern Kookoo-v0.1.4.dmg --dir previous
          bash scripts/tests/sparkle-production-feed-smoke.sh downloaded/Kookoo-v0.1.5.dmg 0.1.5 previous/Kookoo-v0.1.4.dmg
