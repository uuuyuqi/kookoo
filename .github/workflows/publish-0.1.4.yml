name: Publish signed Kookoo 0.1.4
on:
  push:
    paths: ['.github/workflows/publish-0.1.4.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.repository == 'uuuyuqi/kookoo'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      GH_REPO: uuuyuqi/kookoo
      SOURCE_SHA: d06097371deb2d21c4432fa3c13d249404293e4f
      VERIFIED_RUN: '43584092275'
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact tested and signed artifacts
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/$VERIFIED_RUN --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api repos/$GH_REPO/actions/runs/$VERIFIED_RUN --jq '.conclusion')" = success
          mkdir -p dist
          gh run download "$VERIFIED_RUN" --repo "$GH_REPO" --name Kookoo-macOS --dir dist
          shasum -a 256 -c dist/SHA256SUMS
          signature=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("dist/appcast.xml").find(".//enclosure").attrib["{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature"])')
          swift scripts/verify-update-signature.swift dist/Kookoo-v0.1.4.dmg "$(cat config/sparkle-public-key.txt)" "$signature"
      - name: Publish preview archive without replacing previous releases
        run: |
          cat > notes.md <<'NOTES'
          Kookoo 0.1.4 Preview adds independent rounded terminal-pane cards, restrained split entrance animation, and pane zoom/restore next to the split buttons in each pane header.

          New panes animate once, without animating terminal cell-grid layout; Reduce Motion disables the entrance. Existing panes do not replay the entrance on workspace changes or tree reparenting. The split drag hit area and keyboard shortcuts are preserved. Pane zoom controls are excluded from the tab area's window-double-click action.

          Validation: macOS unit tests, app/DMG build and package icon checks, production archive signature verification, and isolated real Sparkle installer tests. Publication verifies downloaded release bytes and the real HTTPS production feed, including upgrade from the previously shipped 0.1.3 app.

          Limits: native pane animation/Metal clipping, active-terminal focus/resize interactions, and GUI Later/Restart still require interactive visual acceptance. Tests are not a claim that those GUI flows were exercised. Installation/restart ends running terminal sessions: save your work first. This release does not restart your current app automatically.

          Apple silicon/macOS 14+. Ad-hoc signed, not Apple-notarized. Gatekeeper and enterprise policies may still block execution; no security controls are bypassed. Update archives use the existing protected Sparkle signing key; no private key is included in source, artifacts or logs.
          NOTES
          gh release create v0.1.4 --repo "$GH_REPO" --target "$SOURCE_SHA" --title "Kookoo 0.1.4 Preview" --prerelease --notes-file notes.md dist/Kookoo-v0.1.4.dmg dist/SHA256SUMS dist/appcast.xml
      - name: Verify uploaded asset and activate public update feed
        run: |
          mkdir downloaded
          gh release download v0.1.4 --repo "$GH_REPO" --dir downloaded
          cmp dist/Kookoo-v0.1.4.dmg downloaded/Kookoo-v0.1.4.dmg
          cmp dist/appcast.xml downloaded/appcast.xml
          python3 - <<'PY' > feed-request.json
          import base64,json,pathlib,subprocess
          data={"message":"Publish verified 0.1.4 signed update feed","content":base64.b64encode(pathlib.Path("dist/appcast.xml").read_bytes()).decode(),"branch":"main"}
          p=subprocess.run(["gh","api","repos/uuuyuqi/kookoo/contents/appcast.xml"],capture_output=True,text=True)
          if p.returncode==0:data["sha"]=json.loads(p.stdout)["sha"]
          print(json.dumps(data))
          PY
          gh api --method PUT repos/$GH_REPO/contents/appcast.xml --input feed-request.json --silent
          for i in {1..24}; do
            if curl -fsSL https://raw.githubusercontent.com/uuuyuqi/kookoo/main/appcast.xml -o public-appcast.xml && cmp -s dist/appcast.xml public-appcast.xml; then break; fi
            sleep 5
          done
          cmp dist/appcast.xml public-appcast.xml
      - name: Verify real published feed can install its signed archive
        run: |
          mkdir previous
          gh release download v0.1.3 --repo "$GH_REPO" --pattern Kookoo-v0.1.3.dmg --dir previous
          bash scripts/tests/sparkle-production-feed-smoke.sh downloaded/Kookoo-v0.1.4.dmg 0.1.4 previous/Kookoo-v0.1.3.dmg
